# Resume AI Agent API - Configuration Properties

# REST API HTTP Listener (port 8081)
http.port=8081

# MCP Server - Streamable HTTP (shared port 8081, path /mcp)
# On CloudHub 2.0, only one public port is available — both REST and MCP share port 8081
# Local: http://localhost:8081/mcp
# CloudHub: https://<app-name>.<region>.cloudhub.io/mcp
mcp.port=8081
mcp.path=/mcp
mcp.serverName=resume-ai-agent
mcp.serverVersion=1.0.0
